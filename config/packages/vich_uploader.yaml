vich_uploader:
    db_driver: orm

    mappings:
        avatar:
            uri_prefix: img/uploads/avatar
            upload_destination: "%kernel.project_dir%/public/img/uploads/avatar"
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        products:
            uri_prefix: img/uploads/products
            upload_destination: "%kernel.project_dir%/public/img/uploads/products"
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
